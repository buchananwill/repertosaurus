// The Compose compiler never sees `shared`, so every class there reaches this module as unstable and
// every composable taking one recomposes on any state emission (journal session 11, F18 B1).
//
// Each class listed here is immutable: `val`s only, of stable types or of the classes listed here,
// and no mutable collections. Their `List` fields (and `SuggestionDeck.shown`, a `Set`, and
// `SuggestTuning.radii`, a `Map`) are read-only
// collections that nothing mutates after construction, which is why the class, not `List`, is
// declared. `SessionState`'s `by lazy` properties are caches of that immutable state, not state of their own.
//
// Adding a class: check it the same way, and never list one with a `var` or a mutable collection.

// P9a (triage T9): SessionRow's `priority` and `confidence` are `RatingLevel?` vals, an enum. SessionState's
